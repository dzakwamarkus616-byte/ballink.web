<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BallLink - Football Talent</title>
<style>
body{background:#0a0a14;color:white;font-family:Arial;margin:0;padding-bottom:80px}
.header{padding:14px;background:#101021;display:flex;justify-content:space-between}
.card{background:#151528;margin:12px;padding:15px;border-radius:16px}
.btn{background:#00ff88;color:black;padding:12px;border:none;border-radius:10px;font-weight:bold;width:100%}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#101021;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222}
.nav{color:gray;text-align:center} .nav.active{color:#00ff88}
.page{display:none}.page.show{display:block}
</style></head><body>

<div class="header"><b>BALLLINK</b><span style="color:#00ff88">● Live</span></div>

<div id="home" class="page show">
<div class="card"><h3>Markus dzakwa ✅</h3><p>Striker - 33 Goals - Biba FC</p><button class="btn">📩 Contact</button></div>
<div class="card"><h3>Tomiwa ⚽</h3><p>Winger - Fulham - 12 Goals</p><button class="btn">📩 Contact</button></div>
</div>

<div id="msgs" class="page"><div class="card">💬 No messages yet</div></div>

<div id="prof" class="page"><div class="card" style="text-align:center">
<h3>ADMIN Scout ✅</h3><p>FIFA Scout - Nigeria</p><p style="color:#00ff88">VERIFIED SCOUT</p>
<button class="btn">Edit Profile</button>
</div></div>

<div class="bottom">
<div class="nav active" onclick="openPage('home',this)">🎯<br><small>Scout</small></div>
<div class="nav" onclick="openPage('msgs',this)">💬<br><small>Messages</small></div>
<div class="nav" onclick="openPage('prof',this)">👤<br><small>Profile</small></div>
<div class="nav" onclick="alert('Logged out')">↪️<br><small>Logout</small></div>
</div>

<script>
function openPage(id,el){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
document.getElementById(id).classList.add('show');
document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
if(el) el.classList.add('active');
}
</script>
</body></html>
